services:
  app:
    build: .
    container_name: stellar_one_app
    ports:
      - "${APP_PORT:-8000}:8000"
    # Custom props from a root-level .env file (optional) are injected here.
    env_file:
      - path: .env
        required: false
    # These override values from .env, since localhost means something else inside a container.
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-stellar_one}}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Custom OpenAI-compatible endpoint for chat (e.g. Ollama at http://host.docker.internal:11434/v1).
      # Falls back to OPENAI_BASE_URL from .env; empty means the default OpenAI API.
      OPENAI_BASE_URL: ${DOCKER_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: stellar_one_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    # Custom props from a root-level .env file (optional). Only VITE_* ones are written to /env.js for the app.
    env_file:
      - path: .env
        required: false
    depends_on:
      - app

  db:
    image: pgvector/pgvector:pg16
    container_name: stellar_one_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stellar_one}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
